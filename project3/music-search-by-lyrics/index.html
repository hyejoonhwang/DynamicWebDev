<html>  
<head>
    <title>music search by lyrics</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic&family=Single+Day&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" ></script>

</head>
<body>
    <div class="bg-glow"></div>
    <div class="container">

        <!-- HERO / HEADER -->
       <div class="hero">
            <h1 class="hero-title">what do you want to say?</h1>
            <p class="hero-subtitle">Type anything and find the song that matches</p>
        </div>


        <!-- SEARCH BAR -->
       <div class="search-box">
            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Type a feeling, a phrase, anything..."
            />
            <button id="searchBtn" class="search-btn">Search</button>            
        </div>
        <p class="hint">Try: "dancing in the moonlight" or "I feel so lonely"</p>

        <!-- RESULTS — JavaScript fills this in -->
        <div id="results"></div>


    </div>







    
</body>

</html>
